<!--
  Donation Array — Tier 2: Wired to Custom Mailing Fields
  Your team edits these fields from the AK Compose screen:
    donation_amount_1    — first button amount (integer, e.g. 25)
    donation_amount_2    — second button amount (integer, e.g. 50)
    donation_amount_3    — third button amount (integer, e.g. 100)
    donation_page_shortname   — AK donation page name (e.g. give-2026-spring)
  See README.md for one-time admin setup instructions.
-->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin: 24px auto; width: 100%; max-width: 600px;">
  <tr>

    <!-- Button 1 -->
    <td align="center" valign="top" style="padding: 0 4px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
        href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ custom_fields.donation_amount_1 }}&amp;prefill=1"
        style="height:48px; v-text-anchor:middle; width:180px;"
        arcsize="8%"
        stroke="f"
        fillcolor="#1a57c2">
        <w:anchorlock/>
        <center style="color:#ffffff; font-family:Helvetica,Arial,sans-serif; font-size:16px; font-weight:bold;">${{ custom_fields.donation_amount_1 }}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ custom_fields.donation_amount_1 }}&amp;prefill=1"
         target="_blank"
         rel="noopener"
         style="
           background-color: #1a57c2;
           border-radius: 4px;
           color: #ffffff;
           display: inline-block;
           font-family: Helvetica, Arial, sans-serif;
           font-size: 16px;
           font-weight: bold;
           line-height: 48px;
           min-height: 48px;
           padding: 0 20px;
           text-align: center;
           text-decoration: none;
           -webkit-text-size-adjust: none;
           mso-hide: all;
         ">${{ custom_fields.donation_amount_1 }}</a>
      <!--<![endif]-->
    </td>

    <!-- Button 2 -->
    <td align="center" valign="top" style="padding: 0 4px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
