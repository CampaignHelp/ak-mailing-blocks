{% with base=donations.highest_previous_all|default:25 %}
<!--
  Donation Array — Tier 3b: Personalized, with a default for non-donors
  Same as Tier 3, but nobody gets skipped. Each recipient sees three buttons:
    Button 1: their highest prior donation
    Button 2: 1.5x that amount (rounded to integer)
    Button 3: 2x that amount (rounded to integer)

  Recipients with no prior donation history fall back to the number on the
  first line (the "with base=..." line). Change the 25 to whatever base ask
  you want:
    base=25  ->  non-donors see $25 / $38 / $50
    base=50  ->  non-donors see $50 / $75 / $100
  There is no requires_value tag here, so the mailing sends to everyone.

  One CMF required:
    donation_page_shortname — AK donation page name (reuse from Tier 2 if already created)

  No amount CMFs needed — amounts are computed from donations.highest_previous_all.
-->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin: 24px auto; width: 100%; max-width: 600px;">
  <tr>

    <!-- Button 1: exact prior amount -->
    <td align="center" valign="top" style="padding: 0 4px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
        href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ base|floatformat:"0" }}&amp;prefill=1"
        style="height:48px; v-text-anchor:middle; width:180px;"
        arcsize="8%"
        stroke="f"
        fillcolor="#1a57c2">
        <w:anchorlock/>
        <center style="color:#ffffff; font-family:Helvetica,Arial,sans-serif; font-size:16px; font-weight:bold;">${{ base|floatformat:"0" }}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ base|floatformat:"0" }}&amp;prefill=1"
         target="_blank"
         rel="noopener"
         style="
           background-color: #1a57c2;
           border-radius: 4px;
           color: #ffffff;
           display: inline-block;
           font-family: Helvetica, Arial, sans-serif;
           font-size: 16px;
           font-weight: bold;
           line-height: 48px;
           min-height: 48px;
           padding: 0 20px;
           text-align: center;
           text-decoration: none;
           -webkit-text-size-adjust: none;
           mso-hide: all;
         ">${{ base|floatformat:"0" }}</a>
      <!--<![endif]-->
    </td>

    <!-- Button 2: 1.5x prior amount -->
    <td align="center" valign="top" style="padding: 0 4px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
        href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ base|multiply:"1.5"|floatformat:"0" }}&amp;prefill=1"
        style="height:48px; v-text-anchor:middle; width:180px;"
        arcsize="8%"
        stroke="f"
        fillcolor="#1a57c2">
        <w:anchorlock/>
        <center style="color:#ffffff; font-family:Helvetica,Arial,sans-serif; font-size:16px; font-weight:bold;">${{ base|multiply:"1.5"|floatformat:"0" }}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ base|multiply:"1.5"|floatformat:"0" }}&amp;prefill=1"
         target="_blank"
         rel="noopener"
         style="
           background-color: #1a57c2;
           border-radius: 4px;
           color: #ffffff;
           display: inline-block;
           font-family: Helvetica, Arial, sans-serif;
           font-size: 16px;
           font-weight: bold;
           line-height: 48px;
           min-height: 48px;
           padding: 0 20px;
           text-align: center;
           text-decoration: none;
           -webkit-text-size-adjust: none;
           mso-hide: all;
         ">${{ base|multiply:"1.5"|floatformat:"0" }}</a>
      <!--<![endif]-->
    </td>

    <!-- Button 3: 2x prior amount -->
    <td align="center" valign="top" style="padding: 0 4px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
        href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ base|multiply:"2"|floatformat:"0" }}&amp;prefill=1"
        style="height:48px; v-text-anchor:middle; width:180px;"
        arcsize="8%"
        stroke="f"
        fillcolor="#1a57c2">
        <w:anchorlock/>
        <center style="color:#ffffff; font-family:Helvetica,Arial,sans-serif; font-size:16px; font-weight:bold;">${{ base|multiply:"2"|floatformat:"0" }}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="https://yourorg.actionkit.com/donate/{{ custom_fields.donation_page_shortname }}/?amount={{ base|multiply:"2"|floatformat:"0" }}&amp;prefill=1"
         target="_blank"
         rel="noopener"
         style="
           background-color: #1a57c2;
           border-radius: 4px;
           color: #ffffff;
           display: inline-block;
           font-family: Helvetica, Arial, sans-serif;
           font-size: 16px;
           font-weight: bold;
           line-height: 48px;
           min-height: 48px;
           padding: 0 20px;
           text-align: center;
           text-decoration: none;
           -webkit-text-size-adjust: none;
           mso-hide: all;
         ">${{ base|multiply:"2"|floatformat:"0" }}</a>
      <!--<![endif]-->
    </td>

  </tr>
</table>
{% endwith %}
